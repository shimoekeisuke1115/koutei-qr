<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工程QR</title>
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
<style>
/* 現場のスマホ用。手袋でも押せるよう、ボタンは大きく・間隔広め */
:root {
  --bg: #f4f5f2; --card: #ffffff; --fg: #1b2420; --muted: #5f6d66; --line: #d6dcd7;
  --accent: #0b6b4f; --accent-fg: #ffffff;
  --run: #0b6b4f; --run-soft: #e2f2ea;
  --pause: #9a5a00; --pause-soft: #fdf0dc;
  --done: #6b7671; --done-soft: #eceeec;
  --todo: #33506e; --todo-soft: #e6edf5;
  --err: #a32020; --err-soft: #fbe6e6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
main { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
button { font: inherit; border: 0; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: default; }
.big { width: 100%; min-height: 64px; font-size: 19px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.sub { min-height: 46px; padding: 0 16px; background: var(--card); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }
.manual { display: flex; gap: 8px; }
.manual input { flex: 1; min-width: 0; min-height: 46px; font: inherit; font-size: 18px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); text-transform: uppercase; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.msg { padding: 12px 14px; border-radius: 10px; font-weight: 600; }
.msg.err { background: var(--err-soft); color: var(--err); }
.msg.info { background: var(--todo-soft); color: var(--todo); }
.msg.ok { background: var(--run-soft); color: var(--run); }
.head { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.head .no { font-size: 24px; font-weight: 800; letter-spacing: .02em; }
.head .who { font-weight: 600; }
.head .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.proc { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--todo); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.proc.s-run { border-left-color: var(--run); }
.proc.s-pause { border-left-color: var(--pause); }
.proc.s-done { border-left-color: var(--done); background: var(--done-soft); }
.proc.mine { box-shadow: 0 0 0 2px var(--run); }
.proc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.proc .name { font-size: 18px; font-weight: 700; }
.proc .n { color: var(--muted); font-size: 13px; margin-right: 6px; }
.badge { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.s-todo .badge { background: var(--todo-soft); color: var(--todo); }
.s-run .badge { background: var(--run-soft); color: var(--run); }
.s-pause .badge { background: var(--pause-soft); color: var(--pause); }
.s-done .badge { background: #dfe3e0; color: var(--done); }
.proc .info { font-size: 13px; color: var(--muted); }
.proc .mine-tag { color: var(--run); font-weight: 700; }
.btns { display: flex; gap: 8px; }
.btns button { flex: 1; min-height: 56px; font-size: 18px; font-weight: 700; color: #fff; }
.b-start, .b-resume { background: var(--run); }
.b-pause { background: var(--pause); }
.b-done { background: #374a42; }
.b-done.arm { background: var(--err); }
.hidden { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121815; --card: #1b231f; --fg: #e5ece7; --muted: #9aaaa2; --line: #313d37;
    --accent: #3fae84; --accent-fg: #0d1411; --run: #4cc597; --run-soft: #1b3a2e; --pause: #f0b060; --pause-soft: #3a2c16;
    --done: #8d9993; --done-soft: #1a201d; --todo: #8fb3dc; --todo-soft: #1d2a38; --err: #ff8f8f; --err-soft: #3d1c1c; }
  .s-done .badge { background: #2a322e; }
  .btns button { color: #0d1411; }
  .b-done { background: #a9bdb4; }
}
</style>
</head>
<body>
<main>
  <div class="bar"><span id="me">読み込み中…</span><span id="clock"></span></div>

  <div id="msg" class="msg hidden"></div>

  <!-- QR を読む前 -->
  <section id="home" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <button id="scanBtn" class="big">QR を読む</button>
    <div class="manual">
      <input id="manualNo" inputmode="text" autocomplete="off" placeholder="指図書番号（例 K829）">
      <button id="manualBtn" class="sub">開く</button>
    </div>
    <p class="hint">カメラが開かないときは、指図書番号を入れて「開く」を押してください。</p>
  </section>

  <!-- 指図書 -->
  <section id="sheet" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <div class="head">
      <div class="no" id="hNo"></div>
      <div class="who" id="hWho"></div>
      <div class="meta" id="hMeta"></div>
    </div>
    <div id="list" class="list"></div>
    <div class="row2">
      <button id="reloadBtn" class="sub">読み直す</button>
      <button id="againBtn" class="sub">別の QR を読む</button>
    </div>
  </section>
</main>

<script>
// ───── 設定（導入時に書き換える）─────
var WOFF_ID   = 'ここに WOFF ID';
var RELAY_URL = 'https://script.google.com/macros/s/AKfycbxT6AMWIruWxbaEsoonP2vciLdo8DI7a68_Net3JJOsJ3QtGXfqkvv0TH9okdqRVlL0/exec';
// ───────────────────────────────

var token = '';
var meName = '';
var rec = null;          // いま表示している指図書
var busy = false;
var clockOffset = 0;     // 中継の時計 − スマホの時計（表示用の経過時間だけに使う）
var armTimer = null;

var $ = function (id) { return document.getElementById(id); };

function show(view) {
  $('home').classList.toggle('hidden', view !== 'home');
  $('sheet').classList.toggle('hidden', view !== 'sheet');
}
function say(text, kind) {
  var m = $('msg');
  if (!text) { m.className = 'msg hidden'; return; }
  m.textContent = text;
  m.className = 'msg ' + (kind || 'info');
}

// ───── 起動 ─────
woff.init({ woffId: WOFF_ID }).then(function () {
  if (!woff.isInClient() && !woff.isLoggedIn()) { woff.login(); return; }
  token = woff.getAccessToken();
  return woff.getProfile().then(function (p) {
    $('me').textContent = (p && p.displayName ? p.displayName : '') + ' さん';
  }).catch(function () { $('me').textContent = ''; }).then(function () {
    show('home');
    if (woff.isInClient()) scan(); // LINE WORKS から開いたらすぐカメラ
  });
}).catch(function (e) {
  $('me').textContent = '';
  say('起動できませんでした。LINE WORKS のメニューから開き直してください（' + (e && e.code || e) + '）', 'err');
});

// ───── QR ─────
function scan() {
  say('');
  woff.scanQR().then(function (r) {
    var target = parseQR(r && r.value);
    if (!target) { say('工程用の QR ではないようです。指図書の QR を読んでください', 'err'); return; }
    find(target);
  }).catch(function (e) {
    // 閉じただけのときも来るので、そっと手入力を案内する
    say('カメラを閉じました。もう一度「QR を読む」か、指図書番号を入れてください', 'info');
  });
}

// https://…/k/226/?ktg_no=K829 → {ktgNo:"K829"} / ?ktg=200 → {ktgId:"200"} / "K829" → {ktgNo:"K829"}
function parseQR(s) {
  s = String(s || '').trim();
  try {
    var u = new URL(s);
    var no = u.searchParams.get('ktg_no');
    if (no) return { ktgNo: no.trim().toUpperCase() };
    var id = u.searchParams.get('ktg');
    if (id && /^\d+$/.test(id)) return { ktgId: id };
    return null;
  } catch (e) {}
  if (/^[A-Za-z0-9_\-]{1,30}$/.test(s)) return { ktgNo: s.toUpperCase() };
  return null;
}

// ───── 中継との通信 ─────
// text/plain のまま送る（GAS はプリフライトに応答しないため、JSON ヘッダーは付けない）
function call(body) {
  body.token = token;
  return fetch(RELAY_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, code: 'network', message: '通信できませんでした。電波のよい場所でもう一度押してください' }; });
}

function find(target) {
  setBusy(true);
  say('読み込み中…', 'info');
  var body = { action: 'find' };
  if (target.ktgNo) body.ktgNo = target.ktgNo; else body.ktgId = target.ktgId;
  call(body).then(function (res) {
    setBusy(false);
    if (!res.ok) { say(res.message, 'err'); show(rec ? 'sheet' : 'home'); return; }
    accept(res);
    if (!rec.fixed) say('工程がまだ決まっていません。製造部長に確認してください', 'err');
    else if (rec.allDone) say('この指図書は完了しています', 'info');
    else say('');
  });
}

function press(r, op) {
  setBusy(true);
  call({ action: 'op', recId: rec.id, rowId: r.id, rowName: r.name, op: op }).then(function (res) {
    setBusy(false);
    if (res.rec) accept(res);       // 失敗でも最新の状態が返ってきたら描き直す
    if (!res.ok) { say(res.message, 'err'); return; }
    say('「' + res.done.row + '」を' + res.done.op + 'しました', 'ok');
    if (navigator.vibrate) navigator.vibrate(60);
  });
}

function accept(res) {
  rec = res.rec;
  if (res.me) meName = res.me;
  if (res.now) clockOffset = res.now - Date.now();
  render();
  show('sheet');
}

function setBusy(b) {
  busy = b;
  document.querySelectorAll('button').forEach(function (x) { x.disabled = b; });
}

// ───── 描画 ─────
var STATE_CLASS = { '未着手': 's-todo', '作業中': 's-run', '中断中': 's-pause', '完了': 's-done' };
var BUTTONS = {
  '未着手': [['start', '開始']],
  '作業中': [['pause', '中断'], ['done', '完了']],
  '中断中': [['resume', '再開'], ['done', '完了']],
  '完了':   []
};

function render() {
  $('hNo').textContent = rec.shizuNo;
  $('hWho').textContent = [rec.customer, rec.bukken].filter(Boolean).join('　');
  $('hMeta').innerHTML = '';
  [rec.type, rec.ship ? '出荷 ' + mdw(rec.ship) : ''].filter(Boolean).forEach(function (t) {
    var s = document.createElement('span'); s.textContent = t; $('hMeta').appendChild(s);
  });

  var list = $('list');
  list.innerHTML = '';
  if (!rec.fixed) return; // 工程未確定のときは一覧を出さない

  rec.rows.forEach(function (r, i) {
    var mine = r.state === '作業中' && meName && r.worker === meName;
    var card = document.createElement('div');
    card.className = 'proc ' + STATE_CLASS[r.state] + (mine ? ' mine' : '');

    var top = document.createElement('div'); top.className = 'top';
    var nm = document.createElement('div'); nm.className = 'name';
    var n = document.createElement('span'); n.className = 'n'; n.textContent = (i + 1) + '.';
    nm.appendChild(n); nm.appendChild(document.createTextNode(r.name));
    var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = r.state;
    top.appendChild(nm); top.appendChild(bd);
    card.appendChild(top);

    var info = document.createElement('div'); info.className = 'info';
    info.dataset.row = r.id;
    card.appendChild(info);
    fillInfo(info, r, mine);

    var defs = BUTTONS[r.state];
    if (defs.length) {
      var btns = document.createElement('div'); btns.className = 'btns';
      defs.forEach(function (d) {
        var b = document.createElement('button');
        b.className = 'b-' + d[0];
        b.textContent = d[1];
        b.disabled = busy;
        b.onclick = function () { onButton(b, r, d[0]); };
        btns.appendChild(b);
      });
      card.appendChild(btns);
    }
    list.appendChild(card);
  });
}

function fillInfo(el, r, mine) {
  var parts = [];
  if (mine) parts.push('<span class="mine-tag">あなたが作業中</span>');
  else if (r.worker) parts.push(esc(r.worker));
  if (r.state !== '未着手') parts.push('実働 ' + dur(liveSec(r)));
  if (r.state === '完了' && r.end) parts.push('完了 ' + hm(r.end));
  else if (r.start) parts.push('開始 ' + hm(r.start));
  if (r.pauses) parts.push('中断 ' + r.pauses + '回');
  el.innerHTML = parts.join('　') || '未着手';
}

// 完了は取り消せないので2回押し（3秒以内）
function onButton(btn, r, op) {
  if (busy) return;
  if (op === 'done' && !btn.classList.contains('arm')) {
    document.querySelectorAll('.b-done.arm').forEach(function (x) { x.classList.remove('arm'); x.textContent = '完了'; });
    btn.classList.add('arm');
    btn.textContent = 'もう一度押すと完了';
    clearTimeout(armTimer);
    armTimer = setTimeout(function () { btn.classList.remove('arm'); btn.textContent = '完了'; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  press(r, op);
}

// 表示用の実働秒（確定分＋いまの区間）。保存には使わない
function liveSec(r) {
  var s = r.sec || 0;
  if (r.resume) {
    var from = Date.parse(r.resume);
    // 締め時刻（17:30 / 21:00）を過ぎた分は数えない（中継がその時刻で自動中断する）
    s += segSec(from, Math.min(Date.now() + clockOffset, dayEndAfter(from)));
  }
  return s;
}
// Code.gs の dayEndAfter_ と同じ
function dayEndAfter(ms) {
  var ENDS = [[17, 30], [21, 0]];
  for (var add = 0; add < 2; add++) {
    for (var i = 0; i < ENDS.length; i++) {
      var e = new Date(ms); e.setDate(e.getDate() + add); e.setHours(ENDS[i][0], ENDS[i][1], 0, 0);
      if (e.getTime() > ms) return e.getTime();
    }
  }
}
// kotei_app.js / Code.gs と同じ式
function segSec(fromMs, toMs) {
  if (!(toMs > fromMs)) return 0;
  var sec = (toMs - fromMs) / 1000, d = new Date(fromMs);
  d.setHours(0, 0, 0, 0);
  for (; d.getTime() < toMs; d.setDate(d.getDate() + 1)) {
    var ls = new Date(d).setHours(12, 0, 0, 0), le = new Date(d).setHours(12, 50, 0, 0);
    sec -= Math.max(0, Math.min(toMs, le) - Math.max(fromMs, ls)) / 1000;
  }
  return Math.max(0, sec);
}

function dur(sec) {
  var m = Math.floor(sec / 60);
  return m < 60 ? m + '分' : Math.floor(m / 60) + '時間' + (m % 60) + '分';
}
function hm(iso) {
  var d = new Date(iso), now = new Date();
  var t = d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
  return d.toDateString() === now.toDateString() ? t : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
}
function mdw(ymd) {
  var p = String(ymd).split('-');
  if (p.length !== 3) return ymd;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）';
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// 作業中の時間を30秒ごとに更新
setInterval(function () {
  $('clock').textContent = new Date().toTimeString().slice(0, 5);
  if (!rec || !rec.fixed) return;
  rec.rows.forEach(function (r) {
    if (r.state !== '作業中') return;
    var el = document.querySelector('.info[data-row="' + r.id + '"]');
    if (el) fillInfo(el, r, meName && r.worker === meName);
  });
}, 30000);
$('clock').textContent = new Date().toTimeString().slice(0, 5);

// ───── ボタン ─────
$('scanBtn').onclick = scan;
$('againBtn').onclick = scan;
$('reloadBtn').onclick = function () { if (rec) find({ ktgNo: rec.shizuNo }); };
$('manualBtn').onclick = function () {
  var v = $('manualNo').value.trim().toUpperCase();
  if (!/^[A-Z0-9_\-]{1,30}$/.test(v)) { say('指図書番号を入れてください（例 K829）', 'err'); return; }
  find({ ktgNo: v });
};
$('manualNo').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('manualBtn').click(); });
</script>
</body>
</html>
